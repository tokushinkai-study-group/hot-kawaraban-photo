<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOT瓦版用画像結合ツール</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>HOT瓦版用画像結合ツール</h1>
      <p class="subtitle">HOT瓦版用の写真を縦並びに1枚のPNGに結合します</p>
    </header>

    <section class="upload-section">
      <h2>画像登録</h2>
      <p class="upload-hint">各枠に画像をドラッグ＆ドロップ、またはクリックして選択してください</p>

      <div class="upload-grid">
       
        <div class="upload-slot slot-empty" data-index="0">
          <p class="slot-label">1枚目</p>
          <div class="slot-body">
            <span class="slot-icon">＋</span>
            <p class="slot-text">画像を追加</p>
          </div>
          <input type="file" class="slot-input" accept="image/*" hidden>
        </div>

        <div class="upload-slot slot-empty" data-index="1">
          <p class="slot-label">2枚目</p>
          <div class="slot-body">
            <span class="slot-icon">＋</span>
            <p class="slot-text">画像を追加</p>
          </div>
          <input type="file" class="slot-input" accept="image/*" hidden>
        </div>

        <div class="upload-slot slot-empty" data-index="2">
          <p class="slot-label">3枚目</p>
          <div class="slot-body">
            <span class="slot-icon">＋</span>
            <p class="slot-text">画像を追加</p>
          </div>
          <input type="file" class="slot-input" accept="image/*" hidden>
        </div>

        </div>
      </div>
    </section>

    <p class="counter" id="counter">0 / 3 枚</p>

    <section class="controls">
      <div class="button-group">
        <button type="button" id="combineBtn" disabled>画像を結合</button>
        <button type="button" id="downloadBtn" disabled>PNGをダウンロード</button>
        <button type="button" id="clearBtn" disabled>すべてクリア</button>
      </div>
    </section>

    <section class="result-section" id="resultSection" hidden>
      <h2>結合結果</h2>
      <div class="result-wrapper">
        <canvas id="resultCanvas"></canvas>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
